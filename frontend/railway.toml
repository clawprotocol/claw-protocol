# Railway: point the frontend service’s config-as-code path at /frontend/railway.toml (see monorepo docs).

[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "sh -c 'npm run preview -- --host 0.0.0.0 --port ${PORT:-4173}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
