name: First Adjudication Gate

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Sync dependencies
        run: |
          uv sync --frozen

      - name: Run tests
        run: |
          uv run pytest -q

      - name: Run first adjudication demo
        run: |
          uv run python -m backend.scripts.demo_first_adjudication

      - name: Verify first adjudication pack
        run: |
          uv run python -m backend.scripts.verify_first_adjudication
