name: Release Smoke

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Sync dependencies
        run: |
          uv sync

      - name: Release smoke test
        run: |
          bash scripts/release/smoke_release.sh
