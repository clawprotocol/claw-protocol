[project]
name = "clawctl"
version = "0.1.0"
description = "Command-line interface for the CLAW Protocol"
requires-python = ">=3.9"
dependencies = [
  "typer",
  "rich",
  "requests",
  "tomli; python_version < '3.11'",
  # backend/runtime
  "fastapi",
  "uvicorn[standard]",
  "pydantic==2.7.1",
  "python-dotenv",
  "aiohttp",
  "python-telegram-bot==20.7",
  "python-multipart",
  # backend document, auth, persistence, and proof runtime
  "pillow>=10.0.0",
  "python-docx==1.1.0",
  "pypdf>=6.0.0",
  "pymupdf>=1.24.0",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=42.0.0",
  "PyJWT>=2.8.0",
  "eth-abi>=5.0.0",
  "eth-utils>=4.0.0",
  "pycryptodome>=3.19.0",
  # dev/test (ok to keep here for now; later we can split to optional groups)
  "pytest",
  "httpx",
  "certifi>=2026.1.4",
  "embit>=0.8.0",
  "openai>=2.21.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "python-multipart",
]

[tool.setuptools]
packages = ["clawctl"]

[project.scripts]
clawctl = "clawctl.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
