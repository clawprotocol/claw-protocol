[project]
name = "clawctl"
version = "0.1.0"
description = "Command-line interface for the CLAW Protocol"
requires-python = ">=3.8"
dependencies = [
    "typer",
    "requests",
    "rich",
    "tomli; python_version < '3.11'",
]

[tool.setuptools]
packages = ["clawctl"]

[project.scripts]
clawctl = "clawctl.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
